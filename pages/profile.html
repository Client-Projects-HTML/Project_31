<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — Grand Palace</title>
<meta name="description" content="Manage your Grand Palace customer profile.">
<script>
  (function(){
    var t = localStorage.getItem('gp-theme') || localStorage.getItem('theme');
    if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
<link rel="icon" href="../assets/images/icons/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/responsive.css">
<link rel="stylesheet" href="../assets/css/dark-mode.css">
<link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body>
<header class="site-header">
  <div class="container nav">
    <a href="../index.html" class="brand">
      <img src="../assets/images/icons/logo.svg" alt="Grand Palace crest" class="brand-mark">
      <span class="brand-name">Grand Palace</span>
    </a>
    <div class="nav-actions">
      <button class="icon-btn" data-theme-toggle title="Toggle Dark/Light Mode" aria-label="Toggle Dark/Light Mode"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
      <button class="icon-btn" data-rtl-toggle title="Toggle RTL Mode" aria-label="Toggle RTL Mode"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></button>
      <a href="login.html" class="btn btn-primary btn-sm">Login</a>
      <button class="hamburger" aria-label="Toggle menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>
<div class="mobile-overlay"></div>
<div class="mobile-panel">
  <div class="mobile-panel-brand" style="display:flex; align-items:center; gap:10px; padding-bottom:16px; margin-bottom:12px; border-bottom:1px solid rgba(255,255,255,.15);">
    <img src="../assets/images/icons/logo.svg" alt="Grand Palace crest" style="width:30px; height:30px;">
    <span style="font-family:var(--font-display); font-size:1.15rem; color:var(--marigold-lt); font-weight:700;">Grand Palace</span>
  </div>

  <div class="mobile-dropdown">
    <button type="button" class="mobile-dropdown-trigger" style="width:100%; display:flex; justify-content:space-between; align-items:center; padding:14px 0; color:#fff; font-size:15px; background:none; border:none; border-bottom:1px solid rgba(255,255,255,.08); text-align:left; cursor:pointer;">
      <span>Home</span>
      <span class="chevron-icon" style="transition:transform .3s ease; color:var(--marigold); font-size:14px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>
    </button>
    <div class="mobile-dropdown-menu" style="display:none; padding-left:14px; background:rgba(0,0,0,.15); border-radius:6px; margin:6px 0;">
      <a href="index.html" style="padding:10px 0; font-size:14px; color:rgba(255,255,255,.85);">Home — Classic</a>
      <a href="home-2.html" style="padding:10px 0; font-size:14px; color:rgba(255,255,255,.85); border-bottom:none;">Home — Premium</a>
    </div>
  </div>

  <a href="about.html">About</a>
  <a href="booking.html">Book Now</a>
  <a href="services.html">Services</a>
  <a href="gallery.html">Gallery</a>
  <a href="contact.html">Contact</a>
  <a href="login.html" class="mobile-login-btn" style="margin-top:20px; display:block; text-align:center; background:var(--marigold); color:var(--wine-dk) !important; font-weight:700; border-radius:999px; padding:12px 20px; border-bottom:none;">Login</a>
</div>

<main>
<section class="dash-shell">
  <aside class="dash-sidebar" style="display:flex; flex-direction:column;">
    <a href="dashboard.html">📊 Customer Dashboard</a>
    <a href="booking-history.html">📖 Booking Requests</a>
    <a href="availability.html">📅 Hall Availability</a>
    <a href="invoice.html">🧾 Invoice Details</a>
    <a href="invoice.html">💳 Manage Payments</a>
    <a href="profile.html" class="active">👤 Customer Profile</a>
    <a href="login.html" class="logout-link" style="margin-top:auto;">🚪 Logout</a>
  </aside>

  <div class="dash-main">
    <div class="section-head" style="text-align:left; margin-bottom:26px;">
      <span class="eyebrow">Account</span>
      <h2 style="margin:0;">Your Profile</h2>
    </div>

    <p id="profile-note" class="small" style="display:none; margin-bottom:18px; color:var(--emerald);"></p>

    <form id="profile-form" class="form-panel" style="max-width:640px;">
      <div class="field-row">
        <div class="field"><label for="p-name">Name</label><input type="text" id="p-name" value="Ananya Kapoor"></div>
        <div class="field"><label for="p-email">Email</label><input type="email" id="p-email" value="ananya.kapoor@example.com"></div>
      </div>

      <div class="field-row">
        <div class="field"><label for="p-phone">Phone</label><input type="tel" id="p-phone" value="+91 98765 43210"></div>
        <div class="field"><label for="p-city">City</label><input type="text" id="p-city" value="Hyderabad"></div>
      </div>

      <div class="field" style="margin-bottom:18px;">
        <label for="p-address">Default Event Billing Address</label>
        <textarea id="p-address" rows="3" class="field-input">Plot 42, Road No 10, Jubilee Hills, Hyderabad, TG 500033</textarea>
      </div>

      <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
  </div>
</section>
</main>

<script>
  window.location.href = 'dashboard.html#profile';
</script>

<script src="../assets/js/main.js"></script>
<script src="../assets/js/dashboard.js"></script>
</body>
</html>
